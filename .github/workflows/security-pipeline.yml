name: WordPress Security Pipeline

# Runs on every push and PR.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:

  # ---------------------------------------------------------
  # JOB 1: Build & smoke-test the stack
  # ---------------------------------------------------------
  build-and-verify:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env

      - name: Build and start containers with dynamic ports
        run: |
          docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} build --no-cache
          docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} up -d

      - name: Get dynamically assigned WordPress host port
        run: |
          WP_PORT=$(docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} port wordpress 80 | cut -d: -f2)
          WP_PORT=${WP_PORT:-8080}
          echo "WordPress is running on host port: $WP_PORT"
          echo "WP_PORT=$WP_PORT" >> "$GITHUB_ENV"
          echo "WP_URL=http://localhost:$WP_PORT" >> "$GITHUB_ENV"

      - name: Wait for WordPress health check
        run: |
          echo "Waiting for WordPress at $WP_URL..."
          until curl -sL "$WP_URL" | grep -qi "WordPress"; do
            sleep 3
          done
          echo "WordPress is online!"

      - name: Clean up stack
        if: always()
        run: docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} down -v --remove-orphans

  # ---------------------------------------------------------
  # JOB 2: Secrets scanning
  # ---------------------------------------------------------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # JOB 3: WordPress security audit (Wordfence feed + wp-cli)
  # ---------------------------------------------------------
  wp-security-audit:
    runs-on: self-hosted
    needs: build-and-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env

      - name: Start the stack
        run: docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} up -d --build

      - name: Resolve WordPress port and URL
        run: |
          WP_PORT=$(docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} port wordpress 80 | cut -d: -f2)
          WP_PORT=${WP_PORT:-8080}
          echo "WP_PORT=$WP_PORT" >> "$GITHUB_ENV"
          echo "WP_URL=http://localhost:$WP_PORT" >> "$GITHUB_ENV"

      - name: Wait for WordPress health check
        run: |
          echo "Waiting for WordPress at $WP_URL..."
          until curl -sL "$WP_URL" | grep -qi "WordPress"; do
            sleep 3
          done
          echo "WordPress is online!"

      - name: Install WordPress (fresh test instance)
        run: |
          docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} exec -T wpcli \
            wp core install \
            --url="$WP_URL" \
            --title="Security Test Site" \
            --admin_user="admin" \
            --admin_password="${{ secrets.CI_WP_ADMIN_PASSWORD }}" \
            --admin_email="test@example.com" \
            --skip-email

      - name: List installed plugins via wp-cli
        run: |
          docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} exec -T wpcli \
            wp plugin list --format=csv | tee plugin-list.csv

      - name: List registered usernames via wp-cli
        run: |
          docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} exec -T wpcli \
            wp user list --field=user_login | tee user-list.txt
          echo "::notice::Registered usernames are visible above."

      - name: Check plugins against Wordfence Intelligence feed
        env:
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}
        run: |
          pip install packaging --break-system-packages --quiet
          python3 check_wordfence_feed.py plugin-list.csv

      - name: Compare against manual watchlist
        run: |
          if [ -f vuln-watchlist.txt ]; then
            echo "Checking plugin-list.csv against vuln-watchlist.txt..."
            while IFS= read -r line; do
              if grep -qi "$line" plugin-list.csv; then
                echo "::warning::Watchlist match found: $line"
              fi
            done < vuln-watchlist.txt
          else
            echo "No vuln-watchlist.txt found."
          fi

      - name: Upload plugin & user lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-security-audit-lists
          path: |
            plugin-list.csv
            user-list.txt
            wordfence-findings.json

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} down -v --remove-orphans

  # ---------------------------------------------------------
  # JOB 4: Static analysis (Semgrep)
  # ---------------------------------------------------------
  semgrep:
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/php
            p/wordpress
            p/secrets

  # ---------------------------------------------------------
  # JOB 5: IaC misconfiguration scanning (Checkov config)
  # ---------------------------------------------------------
  checkov-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov config scan
        uses: bridgecrewio/checkov-action@master
        with:
          file: docker-compose.ci.yml
          framework: yaml
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: false

      - name: Print human-readable summary to the log
        if: always()
        run: |
          echo "=== Checkov config findings (CRITICAL/HIGH) ==="
          jq -r '
            .results.failed_checks[]? |
            "[\(.check_id)] \(.check_name) — \(.resource)"
          ' checkov-report.json/results_json.json 2>/dev/null || \
          jq -r '
            .results.failed_checks[]? |
            "[\(.check_id)] \(.check_name) — \(.resource)"
          ' checkov-report.json || echo "No findings, or nothing to parse."

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-config-report
          path: checkov-report.json*

  # ---------------------------------------------------------
  # JOB 5b: Detect images from docker-compose.ci.yml
  # ---------------------------------------------------------
  detect-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env

      - name: List images from docker-compose.ci.yml
        id: list
        run: |
          python3 - << 'EOF'
          import subprocess, json, os, re

          images = []
          try:
              res = subprocess.run(
                  ["docker", "compose", "-f", "docker-compose.ci.yml", "config", "--images"],
                  capture_output=True, text=True
              )
              if res.returncode == 0 and res.stdout.strip():
                  images = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          except Exception:
              pass

          if not images:
              try:
                  with open("docker-compose.ci.yml", "r") as f:
                      images = re.findall(r'^\s*image:\s*["\']?([^\s\'"]+)["\']?', f.read(), re.MULTILINE)
              except Exception:
                  pass

          unique_images = list(dict.fromkeys(images)) if images else ["mariadb:latest", "wordpress:latest", "wordpress:cli"]
          json_output = json.dumps(unique_images)
          print(f"Detected images: {json_output}")

          if "GITHUB_OUTPUT" in os.environ:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"images={json_output}\n")
          EOF

      - name: Verify GITHUB_OUTPUT actually contains it
        run: cat "$GITHUB_OUTPUT"

  debug-print-images:
    runs-on: ubuntu-latest
    needs: detect-images
    steps:
      - name: Print the raw output value
        run: |
          echo "Value seen by a dependent job: ${{ needs.detect-images.outputs.images }}"

  # ---------------------------------------------------------
  # JOB 6: Container image vulnerability scanning (Trivy image)
  # ---------------------------------------------------------
  trivy-image:
    runs-on: ubuntu-latest
    needs: [detect-images, build-and-verify]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-images.outputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env

      - name: Sanitize image name for use in filenames
        run: |
          SAFE_NAME=$(echo "${{ matrix.image }}" | tr '/:' '--')
          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_ENV"

      - name: Build target container image locally
        run: |
          echo "Building local image for matrix: ${{ matrix.image }}"
          docker compose -f docker-compose.ci.yml build --no-cache

      - name: Ensure .trivyignore exists
        run: touch .trivyignore

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: "json"
          output: "trivy-image-${{ env.SAFE_NAME }}.json"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: "true"
          trivyignores: "./.trivyignore"

      - name: Print human-readable summary to the log
        if: always()
        run: |
          echo "=== Trivy image findings for ${{ matrix.image }} (CRITICAL/HIGH) ==="
          jq -r '
            .Results[]? | select(.Vulnerabilities != null) |
            .Vulnerabilities[] |
            "[\(.Severity)] \(.VulnerabilityID) — \(.PkgName) \(.InstalledVersion) (fixed in \(.FixedVersion // "unknown"))"
          ' "trivy-image-${{ env.SAFE_NAME }}.json" || echo "No findings, or nothing to parse."

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report-${{ env.SAFE_NAME }}
          path: trivy-image-${{ env.SAFE_NAME }}.json

  # ---------------------------------------------------------
  # JOB 7: Dynamic scanning (OWASP ZAP baseline)
  # ---------------------------------------------------------
  zap-baseline:
    runs-on: self-hosted
    needs: build-and-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env

      - name: Start the stack
        run: docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} up -d --build

      - name: Resolve WordPress port and URL
        run: |
          WP_PORT=$(docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} port wordpress 80 | cut -d: -f2)
          WP_PORT=${WP_PORT:-8080}
          echo "WP_PORT=$WP_PORT" >> "$GITHUB_ENV"
          echo "WP_URL=http://localhost:$WP_PORT" >> "$GITHUB_ENV"

      - name: Wait for WordPress health check
        run: |
          echo "Waiting for WordPress at $WP_URL..."
          until curl -sL "$WP_URL" | grep -qi "WordPress"; do
            sleep 3
          done
          echo "WordPress is online!"

      - name: Install WordPress (fresh test instance)
        run: |
          docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} exec -T wpcli \
            wp core install \
            --url="$WP_URL" \
            --title="Security Test Site" \
            --admin_user="admin" \
            --admin_password="${{ secrets.CI_WP_ADMIN_PASSWORD }}" \
            --admin_email="test@example.com" \
            --skip-email

      - name: Run ZAP baseline scan
        run: |
          docker run --network host --user root -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable zap-baseline.py \
            -t $WP_URL \
            -r zap-report.html \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml -p wp-ci-${{ github.run_id }} down -v --remove-orphans

  # ---------------------------------------------------------
  # JOB 8: Deploy to production (CD)
  # ---------------------------------------------------------
  deploy:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      PROD_DIR: /home/user2/wp/WP-Secure-Deployment
    steps:
      - name: Pull latest main into the production directory
        run: |
          cd "$PROD_DIR"
          git fetch origin main
          git checkout main
          git pull origin main
      - name: Apply the change to the production stack
        run: |
          cd "$PROD_DIR"
          docker compose -f docker-compose.prod.yml -p wp-prod up -d
      - name: Confirm the production site responded after deploy
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8080 > /dev/null && echo "Production responded OK" && exit 0
            sleep 5
          done
          echo "::error::Production did not respond after deploy — check it manually."
          exit 1
 
  # ---------------------------------------------------------
  # JOB 9: Security summary (aggregation + PR comment)
  # ---------------------------------------------------------
  security-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [checkov-config, trivy-image, wp-security-audit, zap-baseline]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports
        continue-on-error: true
 
      - name: Build consolidated summary
        run: python3 build_summary.py reports > summary.md
 
      - name: Upload security summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-report
          path: summary.md
 
      - name: Post PR comment or publish Workflow Job Summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
 
            await core.summary.addRaw(body).write();
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              console.log(`Event '${context.eventName}' is not a PR. Outputted summary to GitHub Step Summary.`);
              return;
            }
            const marker = '<!-- security-pipeline-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }
